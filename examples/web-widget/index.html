<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ejemplo de integración del chatbot de Café Nube." />
    <title>Café Nube — Web widget example</title>
    <style>
      :root {
        color: #34231d;
        background: #f7f0e3;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 15% 20%, rgb(255 255 255 / 85%) 0 11rem, transparent 25rem),
          linear-gradient(135deg, #faf4e9, #e9efe4);
      }

      main {
        max-width: 58rem;
        margin: 0 auto;
        padding: clamp(4rem, 12vw, 9rem) 1.5rem;
      }

      .eyebrow {
        color: #405943;
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 11ch;
        margin: 0.75rem 0 1.25rem;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: clamp(3.2rem, 10vw, 6rem);
        line-height: 0.98;
        letter-spacing: -0.055em;
      }

      p {
        max-width: 38rem;
        color: #746a63;
        font-size: 1.1rem;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Ejemplo de integración</div>
      <h1>Café, conversación y código.</h1>
      <p>
        Esta página representa el sitio de un negocio externo. El widget consume el canal HTTP del
        motor sin incorporar lógica del chatbot dentro del cliente.
      </p>
    </main>

    <chatbot-widget
      api-url="http://localhost:3000/api"
      title="Cafetería Nube"
      subtitle="Asistente virtual"
      greeting="¡Hola! Soy el asistente de Cafetería Nube. ¿En qué puedo ayudarte hoy?"
      accent-color="#405943"
    ></chatbot-widget>
    <script src="./chatbot-widget.js"></script>
  </body>
</html>
