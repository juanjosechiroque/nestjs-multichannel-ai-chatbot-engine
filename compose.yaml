services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: chatbot-engine-postgres
    environment:
      POSTGRES_DB: chatbot_engine
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chatbot -d chatbot_engine']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
